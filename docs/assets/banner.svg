<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="NotchIsland — the iPhone's Dynamic Island, reimagined for your MacBook's notch">
  <title>NotchIsland</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="95%">
      <stop offset="0" stop-color="#262b4d"/>
      <stop offset="0.55" stop-color="#0f1121"/>
      <stop offset="1" stop-color="#06070c"/>
    </radialGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4f86"/>
      <stop offset="1" stop-color="#ffa53a"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ee08f"/>
      <stop offset="1" stop-color="#2cc8d8"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9cce0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="190%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="440" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <!-- soft colour behind the island -->
    <ellipse cx="520" cy="96" rx="170" ry="70" fill="#ff4f86" opacity="0.30" filter="url(#glow)"/>
    <ellipse cx="770" cy="104" rx="170" ry="70" fill="#2cc8d8" opacity="0.26" filter="url(#glow)"/>

    <!-- the island, hanging from the top edge like an open Dynamic Island -->
    <g filter="url(#shadow)">
      <path d="M 370 0 H 910 V 104 Q 910 150 864 150 H 416 Q 370 150 370 104 Z" fill="#000000"/>
      <path d="M 370 0 H 910 V 104 Q 910 150 864 150 H 416 Q 370 150 370 104 Z" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
    </g>
    <!-- camera -->
    <circle cx="640" cy="18" r="5" fill="#1b1d2b"/>
    <circle cx="640" cy="18" r="2.2" fill="#3a4170"/>
    <!-- now playing -->
    <rect x="402" y="48" width="74" height="74" rx="16" fill="url(#art)"/>
    <g fill="#ffffff" opacity="0.94">
      <rect x="429.5" y="70" width="4" height="30" rx="2"/>
      <rect x="450.5" y="65" width="4" height="30" rx="2"/>
      <path d="M 429.5 70 L 454.5 64 L 454.5 72 L 429.5 78 Z"/>
      <ellipse cx="424.5" cy="100.5" rx="8" ry="6.2" transform="rotate(-18 424.5 100.5)"/>
      <ellipse cx="445.5" cy="95.5" rx="8" ry="6.2" transform="rotate(-18 445.5 95.5)"/>
    </g>
    <text x="494" y="76" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#ffffff">Now Playing</text>
    <text x="494" y="104" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#8f94b3">Live Activities · AI · Focus</text>
    <!-- waveform -->
    <g fill="url(#wave)">
      <rect x="760" y="74" width="7" height="22" rx="3.5"/>
      <rect x="774" y="60" width="7" height="50" rx="3.5"/>
      <rect x="788" y="68" width="7" height="34" rx="3.5"/>
      <rect x="802" y="52" width="7" height="66" rx="3.5"/>
      <rect x="816" y="64" width="7" height="42" rx="3.5"/>
      <rect x="830" y="58" width="7" height="54" rx="3.5"/>
      <rect x="844" y="72" width="7" height="26" rx="3.5"/>
      <rect x="858" y="66" width="7" height="38" rx="3.5"/>
    </g>

    <!-- wordmark -->
    <text x="640" y="262" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-1.5" fill="url(#word)">NotchIsland</text>
    <text x="640" y="308" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#a7abc6">The iPhone's Dynamic Island, reimagined for your MacBook's notch.</text>

    <!-- feature chips -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#d7d9ea" text-anchor="middle">
      <rect x="203" y="350" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="278" y="376">Live Activities</text>
      <rect x="367" y="350" width="118" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="426" y="376">AI Usage</text>
      <rect x="499" y="350" width="92" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="545" y="376">Focus</text>
      <rect x="605" y="350" width="88" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="649" y="376">Notes</text>
      <rect x="707" y="350" width="104" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="759" y="376">Camera</text>
      <rect x="825" y="350" width="118" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="884" y="376">Clipboard</text>
      <rect x="957" y="350" width="120" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="1017" y="376">Free &amp; open</text>
    </g>
  </g>
</svg>
