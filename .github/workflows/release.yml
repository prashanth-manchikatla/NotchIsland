name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the build number is the commit count

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Build
        run: ./Scripts/build.sh

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --sequesterRsrc --keepParent build/Hoverbird.app "Hoverbird-$VERSION.zip"
          shasum -a 256 "Hoverbird-$VERSION.zip" > "Hoverbird-$VERSION.zip.sha256"

      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {found=1; next} found && (/^## \[/ || /^\[[^]]+\]: /) {exit} found' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ---

          ### Install

          1. Download **Hoverbird-*.zip** below, unzip it and move **Hoverbird.app** to **Applications**.
          2. Open it. macOS can't verify the developer yet, so go to **System Settings › Privacy & Security** and click **Open Anyway** (once).
          3. Grant the permissions for the features you want — see the [README](https://github.com/prashanth-manchikatla/Hoverbird#permissions).

          Verify the download: `shasum -a 256 -c Hoverbird-*.zip.sha256`
          NOTES

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PRERELEASE=""
          [[ "$VERSION" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "$GITHUB_REF_NAME" "Hoverbird-$VERSION.zip" "Hoverbird-$VERSION.zip.sha256" \
            --title "Hoverbird $VERSION" --notes-file notes.md $PRERELEASE
