name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the build number is the commit count

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: No test hooks or debug leftovers
        run: |
          if grep -rnE "SelfTestHook|TEMPORARY test hook|DLDEBUG" boringNotch --include='*.swift'; then
            echo "::error::Remove temporary test hooks before merging."; exit 1
          fi

      - name: Cache compiled dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/manual/debug/lib
            .build/manual/debug/modules
            .build/manual/debug/stamps
          key: vendor-${{ runner.os }}-${{ hashFiles('Vendor/**/*.swift', 'Scripts/build.sh') }}

      - name: Build
        run: ./Scripts/build.sh --debug

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent build/Hoverbird.app Hoverbird-debug.zip

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Hoverbird-debug-${{ github.sha }}
          path: Hoverbird-debug.zip
          retention-days: 7
