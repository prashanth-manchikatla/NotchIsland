labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should NotchIsland do, and when would you use it?
    validations:
      required: true
  - type: textarea
    id: inspiration
    attributes:
      label: Inspiration
      description: An iPhone feature, another app, a sketch — anything that shows what you mean.
